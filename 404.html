<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SIE ENEM · Redirecionando</title>
  <!-- O GitHub Pages mostra esta página para endereços inexistentes.
       Ela leva a pessoa de volta para a página principal. -->
  <script>
    var base = location.pathname.split('/').slice(0, 2).join('/') + '/';
    if (location.hostname.endsWith('github.io')) location.replace(base);
    else location.replace('/');
  </script>
</head>
<body><p>Redirecionando para o <a href="./">SIE ENEM</a>…</p></body>
</html>
